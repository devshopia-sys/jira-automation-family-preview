name: C16P-01 local preview interest
description: Register public interest in the bounded local preview. No support request, data upload, or personal contact collection.
title: "[C16P-01 preview interest]"
body:
  - type: markdown
    attributes:
      value: |
        This public form measures interest in a local Jira automation family-draft preview.

        Do not include an email address, Jira export, project URL, account identifier, configuration, customer data, or any sensitive information. Submitting creates a public GitHub issue under your GitHub account.
  - type: checkboxes
    id: interest
    attributes:
      label: Interest acknowledgement
      options:
        - label: I want to try the bounded local preview when it is available.
          required: true
        - label: I understand that this is public and that no access, support, timeline, or notification is promised.
          required: true
